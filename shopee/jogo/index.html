*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#EE4D2D;--or2:#FF7A45;--dk:#C2351A;--cr:#FFF1EA;--ink:#1C1210;--f:'Manrope',system-ui,sans-serif;--poc-h:40px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--dk);font-family:var(--f);color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;
  background:radial-gradient(60% 80% at 85% 10%,rgba(255,190,140,.55) 0%,rgba(255,190,140,0) 60%),linear-gradient(160deg,var(--or2),var(--or) 45%,var(--dk))}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 72px;gap:40px;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.copy{display:grid;gap:24px;align-content:center}
.logo{height:40px;width:auto;filter:brightness(0) invert(1)}
.badge{justify-self:start;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#fff;color:var(--or);padding:8px 16px;border-radius:999px}
h1{font-size:72px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--cr);text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:8px}
p{font-size:24px;line-height:1.45;font-weight:700;color:#FFE4D8;max-width:28ch}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:12px;min-height:76px;padding:0 44px;border:0;border-radius:999px;font:800 24px var(--f);cursor:pointer;background:#fff;color:var(--or);box-shadow:0 12px 30px rgba(120,20,0,.35),inset 0 -5px 0 #FFD5C4}
.btn:active{transform:translateY(3px)}
.btn[disabled]{opacity:.6}
.foot{font-size:15px;color:#FFD5C4;font-weight:700}
.wheelbox{position:relative;justify-self:center;width:520px;height:520px}
.wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 30px 60px rgba(90,15,0,.45),0 0 0 14px #fff;transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.pin{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:56px solid #fff;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;inset:50%;width:120px;height:120px;margin:-60px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 26px var(--f);color:var(--or);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.cupom{justify-self:center;width:520px;background:#fff;color:var(--or);border-radius:32px;padding:44px 48px;position:relative;box-shadow:0 30px 60px rgba(90,15,0,.4);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.cupom::before,.cupom::after{content:"";position:absolute;top:62%;width:44px;height:44px;border-radius:50%;background:var(--or)}
.cupom::before{left:-22px}.cupom::after{right:-22px}
.cupom .k{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.cupom .v{font-size:96px;font-weight:800;line-height:1;margin:10px 0 6px;letter-spacing:-.03em}
.cupom .d{font-size:20px;font-weight:700;color:#8A3B2A}
.cupom .code{margin-top:34px;border-top:3px dashed #FFC9B5;padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.cupom .code b{font-size:34px;letter-spacing:.08em;background:var(--cr);padding:10px 18px;border-radius:14px}
.cupom .code span{font-size:15px;font-weight:700;color:#8A3B2A;max-width:16ch;line-height:1.35}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(860px) rotate(540deg);opacity:.2}}
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14)}
.poc-left{display:flex;align-items:center;gap:12px}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:700;color:#cbd5e1}
.poc-right{display:flex;align-items:center;gap:10px}
.poc-powered{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
