*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--f:'Manrope',system-ui,sans-serif;--poc-h:40px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--escura);font-family:var(--f);color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;background:var(--escura)}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;display:none}
.screen.on{display:grid;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{height:46px;width:auto;max-width:260px;object-fit:contain;object-position:left}
.logo.branco{filter:brightness(0) invert(1)}
.badge{justify-self:start;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border:2px solid #fff;color:#fff;padding:7px 15px;border-radius:999px}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:12px;min-height:72px;padding:0 44px;border:0;border-radius:999px;font:800 24px var(--f);cursor:pointer;background:#fff;color:var(--cor);box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 -5px 0 var(--suave)}
.btn:active{transform:translateY(3px)}
.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6);box-shadow:none;min-height:60px;padding:0 30px;font-size:20px}
.grad{background:linear-gradient(160deg,var(--cor-luz),var(--cor) 45%,var(--cor-escura))}
/* intro */
#s0{grid-template-columns:560px 1fr}
#s0 .copy{padding:56px 56px 48px;display:grid;align-content:space-between}
#s0 .mid{display:grid;gap:22px}
#s0 h1{font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-.02em}
#s0 p{font-size:23px;line-height:1.45;font-weight:700;color:var(--suave);max-width:26ch}
#s0 .photo{background:center/cover no-repeat var(--cor-escura);position:relative}
#s0 .photo span{position:absolute;left:28px;bottom:26px;font-size:16px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.6);padding:9px 16px;border-radius:999px}
.small{font-size:15px;font-weight:700;color:var(--suave)}
/* perguntas */
.q{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;background:linear-gradient(160deg,color-mix(in srgb,var(--cor) 18%,var(--escura)),var(--escura));padding:44px 72px 110px;gap:30px}
.q.has-hint{grid-template-rows:auto auto auto 1fr}
.qtop{display:flex;align-items:center;justify-content:space-between}
.qtop .logo{height:34px}
.dots{display:flex;gap:10px}
.dots i{width:46px;height:8px;border-radius:9px;background:rgba(255,255,255,.18)}
.dots i.done{background:var(--cor)}
.q h2{font-size:50px;line-height:1.08;font-weight:800;letter-spacing:-.015em;max-width:24ch}
.q .hint{font-size:20px;color:var(--suave);font-weight:700;margin-top:-12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:6px;align-items:stretch}
.opts.n2{grid-template-columns:repeat(2,1fr)}.opts.n4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:0;border-radius:22px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#fff;font:800 30px/1.2 var(--f);text-align:left;padding:34px;display:grid;align-content:space-between;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.opts.n4 .opt{font-size:26px;padding:28px}
.opt span{font-size:64px;line-height:1}
.opt small{font-size:19px;font-weight:700;color:var(--suave)}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--cor);border-color:var(--cor)}
.opt.sel small{color:#fff}
.back{position:absolute;left:72px;bottom:30px;background:none;border:0;color:var(--suave);font:800 18px var(--f);cursor:pointer;padding:10px 0}
/* resultado */
#sr{grid-template-columns:1fr 400px;padding:46px 56px 40px;gap:44px}
#sr .copy{display:grid;align-content:start;gap:20px}
#sr h2{font-size:52px;line-height:1.04;font-weight:800;letter-spacing:-.02em}
#sr .lead{font-size:22px;line-height:1.45;font-weight:700;color:#fff;opacity:.92;max-width:34ch}
.perks{display:grid;gap:10px;margin-top:4px}
.perks div{display:flex;gap:14px;align-items:center;font-size:21px;font-weight:800}
.perks b{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--cor);display:grid;place-items:center;font-size:17px}
.fine{font-size:13px;color:var(--suave);font-weight:700;max-width:62ch}
.card{background:#fff;color:#111;border-radius:26px;padding:24px;display:grid;gap:14px;align-content:start;justify-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card .pic{width:100%;height:150px;border-radius:16px;background:center/cover no-repeat}
.card .qr{width:200px;height:200px}
.card .qr img{width:100%;height:100%;display:block}
.card .big{font-size:56px;font-weight:800;line-height:1;color:var(--cor);letter-spacing:-.03em}
.card strong{font-size:21px;line-height:1.25;font-weight:800}
.card .from{font-size:15px;font-weight:700;color:#666}
.row{display:flex;gap:14px;margin-top:6px}
/* barra POC */
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14)}
.poc-left{display:flex;align-items:center;gap:12px}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:700;color:#cbd5e1}
.poc-right{display:flex;align-items:center;gap:10px;color:#fff}
.poc-powered{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="viewport" id="vp">
  <div id="app"></div>

function esc(t){return String(t).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function fit(){var vp=document.getElementById('vp');var s=Math.min(innerWidth/1280,innerHeight/800);vp.style.transform='scale('+s+')';vp.style.left=Math.round((innerWidth-1280*s)/2)+'px';vp.style.top=Math.round((innerHeight-800*s)/2)+'px'}
addEventListener('resize',fit);fit();
var Q=CFG.perguntas, N=Q.length, ans=[], cls='logo'+(CFG.logo_branco===false?'':' branco');
function logo(h){return '<img class="'+cls+'" src="'+CFG.logo+'" alt="'+esc(CFG.marca)+'"'+(h?' style="height:'+h+'px"':'')+'>'}
function render(){var I=CFG.intro,R=CFG.resultado,h='';
 h+='<section class="screen on" id="s0"><div class="copy grad">'+logo()+'<div class="mid"><span class="badge">'+esc(I.selo)+'</span><h1>'+I.titulo+'</h1><p>'+I.texto+'</p><button class="btn" data-go="1">'+esc(I.botao)+'</button></div><span class="small">'+(I.rodape||'')+'</span></div>'+
  '<div class="photo" style="background-image:url(\''+(CFG.foto||'')+'\')">'+(I.legenda_foto?'<span>'+esc(I.legenda_foto)+'</span>':'')+'</div></section>';
 Q.forEach(function(q,k){var dots='';for(var d=0;d<N;d++)dots+='<i'+(d<=k?' class="done"':'')+'></i>';
  h+='<section class="screen q'+(q.dica?' has-hint':'')+'" id="s'+(k+1)+'" data-k="'+k+'"><div class="qtop">'+logo()+'<div class="dots">'+dots+'</div></div><h2>'+q.pergunta+'</h2>'+(q.dica?'<p class="hint">'+q.dica+'</p>':'')+
   '<div class="opts n'+q.opcoes.length+'">'+q.opcoes.map(function(o,j){return '<button class="opt" data-j="'+j+'"><span>'+(o.emoji||'')+'</span>'+esc(o.texto)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</button>'}).join('')+'</div>'+
   '<button class="back" data-go="'+k+'">← Voltar</button></section>'});
 var C=R.cartao||{};
 h+='<section class="screen grad" id="sr"><div class="copy">'+logo(38)+'<h2 id="rT"></h2><p class="lead" id="rL"></p><div class="perks" id="rP"></div><div class="row"><button class="btn ghost" data-go="0">'+esc(R.botao_refazer||'Refazer o quiz')+'</button></div>'+(R.letra_miuda?'<p class="fine">'+R.letra_miuda+'</p>':'')+'</div>'+
  '<div class="card">'+(C.foto?'<div class="pic" style="background-image:url(\''+C.foto+'\')"></div>':'')+(C.destaque?'<div class="big">'+esc(C.destaque)+'</div>':'')+

function show(n){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
 var el=n>N?document.getElementById('sr'):document.getElementById('s'+n);void el.offsetWidth;el.classList.add('on');

 if(n>N)result()}
function result(){var R=CFG.resultado,tit=R.titulo,lead=[],perks=[];
 ans.forEach(function(j,k){var o=Q[k].opcoes[j]||{};if(o.titulo)tit=o.titulo;if(o.frase)lead.push(o.frase);if(o.beneficio)perks.push(o.beneficio)});
