<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One page e Media kit • Goomer Ads</title>
<meta name="description" content="Materiais comerciais da Goomer Ads por marca.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p-700:#2b00ff; --p-800:#2501d6; --p-900:#2003af;
  --t-50:#f0f0ff; --t-200:#cdceff;
  --n-0:#ffffff; --n-50:#f8fafc; --n-200:#e2e8f0; --n-500:#64748b;
  --n-600:#475569; --n-900:#15161d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Manrope","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;font-weight:500;line-height:1.7;color:var(--n-900);background:var(--n-0);-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(20px,9.7vw,140px)}

header{padding:32px 0 24px}
.ga{display:inline-flex;flex-direction:column;align-items:flex-end;margin-bottom:20px;line-height:1}
.ga img{height:28px;width:auto;display:block}
.ga span{font-size:16px;font-weight:600;color:var(--p-700);margin-top:4px;letter-spacing:-.014em}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.022em;max-width:24ch;margin-bottom:12px}
.lede{font-size:16px;color:var(--n-600);max-width:520px}

.filtros{position:sticky;top:0;z-index:5;background:var(--n-0);border-bottom:1px solid var(--n-200)}
.filtros .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.filtros .wrap::-webkit-scrollbar{display:none}
.tipos{display:flex;gap:4px;background:var(--n-50);border:1px solid var(--n-200);border-radius:14px;padding:4px;width:max-content;max-width:100%;margin-top:28px}
.tipo-btn{border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--n-600);padding:10px 20px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.tipo-btn .n{margin-left:6px;color:var(--n-500);font-variant-numeric:tabular-nums}
.tipo-btn[aria-pressed="true"]{background:var(--p-700);color:var(--n-0)}
.tipo-btn[aria-pressed="true"] .n{color:var(--t-200)}
.tipo-btn:not([aria-pressed="true"]):hover{color:var(--p-700)}
.chip{flex-shrink:0;white-space:nowrap;border:1px solid var(--n-200);background:var(--n-0);color:var(--n-900);border-radius:100px;padding:8px 16px;font:inherit;font-size:14px;font-weight:600;line-height:1.4;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--p-700)}
.chip .n{color:var(--n-500);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--p-700);border-color:var(--p-700);color:var(--n-0)}
.chip[aria-pressed="true"] .n{color:var(--t-200)}

main{padding:0 0 64px}
.secao{padding:24px 0 0}
.secao + .secao{margin-top:16px;border-top:1px solid var(--n-200)}
.rot{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--p-700);margin-bottom:12px}
.secao h2{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.022em;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.card{display:flex;flex-direction:column;border:1px solid var(--n-200);border-radius:16px;overflow:hidden;background:var(--n-0);transition:border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--p-700);outline:none}
.card .thumb{aspect-ratio:16/10;background:var(--n-50);border-bottom:1px solid var(--n-200);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.03)}
.card .meta{padding:20px 24px 24px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .tipo{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--n-500)}
.card .nome{font-size:20px;font-weight:600;line-height:1.5;letter-spacing:-.014em}
.card .desc{font-size:14px;color:var(--n-600);line-height:1.5;flex:1}
.card .cta{margin-top:16px;align-self:flex-start;background:var(--p-700);color:var(--n-0);border-radius:10px;padding:7px 16px;font-size:14px;font-weight:600;transition:background-color .2s}
.card:hover .cta{background:var(--p-800)}
.vazio{color:var(--n-500);padding:24px 0}

footer{padding:48px 0 80px;border-top:1px solid var(--n-200);font-size:14px;color:var(--n-500)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="ga" aria-label="Goomer Ads"><img src="_hub/goomer.svg" alt="goomer"><span>Ads</span></div>
    <h1>Materiais comerciais por marca.</h1>
    <p class="lede">One pages e media kits da Goomer Ads. Escolha o material, depois o setor, e toque em uma marca para abrir.</p>
    <div class="tipos" id="tipos" role="group" aria-label="Tipo de material"></div>
  </div>
</header>

<nav class="filtros" aria-label="Filtrar por setor">
  <div class="wrap" id="filtros"></div>
</nav>

<main><div class="wrap" id="secoes"></div></main>

<footer><div class="wrap">Uso interno. Goomer Ads.</div></footer>

<script>
// Para incluir um material novo, adicione uma linha aqui e uma miniatura em _hub/thumbs/.
var SETORES = {
  financeiro:   'Financeiro',
  imobiliario:  'Construtoras e Imobiliário',
  alimentos:    'Alimentos e Bebidas',
  varejo:       'Apps e Varejo',
  automotivo:   'Automotivo',
  b2b:          'Indústria B2B',
  agencias:     'Agências'
};
var MATERIAIS = [
  {marca:'Mastercard',        tipo:'One page', setor:'financeiro',  url:'/mastercard/',        thumb:'mastercard',        desc:'A chave da sorte, com portas premiadas.'},
  {marca:'Banco Safra',       tipo:'Media kit', setor:'financeiro',  url:'/safra/media-kit/',   thumb:'safra-media-kit',   desc:'Media kit B2C personalizado.'},
  {marca:'Cyrela · Living',   tipo:'One page', setor:'imobiliario', url:'/cyrela/',            thumb:'cyrela',            desc:'Tour pelo decorado no tablet.'},
  {marca:'Cyrela · Living',   tipo:'Media kit', setor:'imobiliario', url:'/cyrela/media-kit/',  thumb:'cyrela-media-kit',  desc:'Media kit com a cara da Cyrela.'},
  {marca:'Tenda',             tipo:'One page', setor:'imobiliario', url:'/tenda/',             thumb:'tenda',             desc:'Reserva Sacomã, com quiz "Seu primeiro apê".'},
  {marca:'Housi',             tipo:'One page', setor:'imobiliario', url:'/housi/',             thumb:'housi',             desc:'Moradia sem burocracia.'},
  {marca:'Housi',             tipo:'Media kit', setor:'imobiliario', url:'/housi/media-kit/',   thumb:'housi-media-kit',   desc:'Media kit B2C personalizado.'},
  {marca:'Estrella Galicia',  tipo:'One page', setor:'alimentos',   url:'/estrella-galicia/',  thumb:'estrella-galicia',  desc:'Jogo Tirada Perfeita 0,0 e sorteio de experiência.'},
  {marca:'99Food',            tipo:'One page', setor:'varejo',      url:'/99food/',            thumb:'99food',            desc:'Roleta de cupom com cadastro por e-mail.'},
  {marca:'Shopee',            tipo:'One page', setor:'varejo',      url:'/shopee/',            thumb:'shopee',            desc:'11.11 com roleta de cupons.'},
  {marca:'Insider',           tipo:'One page', setor:'varejo',      url:'/insider/',           thumb:'insider',           desc:'Cadastro no Insider Members com 10% OFF.'},
  {marca:'BYD',               tipo:'One page', setor:'automotivo',  url:'/byd/',               thumb:'byd',               desc:'Seu test-drive na mesa do cliente.'},
  {marca:'Rebal',             tipo:'One page', setor:'b2b',         url:'/rebal/',             thumb:'rebal',             desc:'Banner no painel do dono (B2B).'},
  {marca:'AlmapBBDO',         tipo:'Media kit', setor:'agencias',    url:'/almapbbdo/media-kit/', thumb:'almapbbdo-media-kit', desc:'Media kit com seletor das marcas atendidas.'},
  {marca:'Jota', tipo:'One page', setor:'agencias', url:'/jota/', thumb:'jota', desc:'Ativações de Mercado Livre (jogo), Life360 (quiz) e Sicredi (roleta).'},
  {marca:'Jota', tipo:'Media kit', setor:'agencias', url:'/jota/media-kit/', thumb:'jota-media-kit', desc:'Media kit com as ativações de Mercado Livre, Life360 e Sicredi.'}
];

var TIPOS = ['One page','Media kit'];
var filtro = {setor:'', tipo:'One page'};
try { var h = decodeURIComponent(location.hash.slice(1)); if (h==='media-kit') filtro.tipo='Media kit'; } catch(e){}

function chip(label, n, attr, val, on){
  return '<button type="button" class="chip" data-'+attr+'="'+val+'" aria-pressed="'+on+'"><span>'+label+'</span><span class="n">'+n+'</span></button>';
}
function conta(f){ return MATERIAIS.filter(f).length; }

function renderTipos(){
  document.getElementById('tipos').innerHTML = TIPOS.map(function(t){
    var n = conta(function(m){ return m.tipo===t; });
    return '<button type="button" class="tipo-btn" data-tipo="'+t+'" aria-pressed="'+(filtro.tipo===t)+'">'+t+'<span class="n">'+n+'</span></button>';
  }).join('');
}

function renderFiltros(){
  var porTipo = MATERIAIS.filter(function(m){ return m.tipo===filtro.tipo; });
  var h = chip('Todos', porTipo.length, 'setor', '', filtro.setor==='');
  Object.keys(SETORES).forEach(function(k){
    var n = porTipo.filter(function(m){ return m.setor===k; }).length;
    if (n) h += chip(SETORES[k], n, 'setor', k, filtro.setor===k);
  });
  document.getElementById('filtros').innerHTML = h;
}

function card(m){
  return '<a class="card" href="'+m.url+'">'+
    '<div class="thumb"><img loading="lazy" src="_hub/thumbs/'+m.thumb+'.webp" alt=""></div>'+
    '<div class="meta"><span class="tipo">'+m.tipo+'</span><span class="nome">'+m.marca+'</span>'+
    '<span class="desc">'+m.desc+'</span><span class="cta">Abrir</span></div></a>';
}

function renderSecoes(){
  var h = '';
  Object.keys(SETORES).forEach(function(k){
    if (filtro.setor && filtro.setor!==k) return;
    var itens = MATERIAIS.filter(function(m){ return m.setor===k && m.tipo===filtro.tipo; });
    if (!itens.length) return;
    h += '<section class="secao"><div class="rot">'+itens.length+(itens.length>1?' materiais':' material')+'</div>'+
         '<h2>'+SETORES[k]+'</h2><div class="grid">'+itens.map(card).join('')+'</div></section>';
  });
  document.getElementById('secoes').innerHTML = h || '<p class="vazio">Nenhum material nesse filtro.</p>';
}

document.getElementById('filtros').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  filtro.setor = b.getAttribute('data-setor');
  renderFiltros(); renderSecoes();
});
document.getElementById('tipos').addEventListener('click', function(e){
  var b = e.target.closest('.tipo-btn'); if (!b) return;
  filtro.tipo = b.getAttribute('data-tipo'); filtro.setor = '';
  try { history.replaceState(null,'', filtro.tipo==='Media kit' ? '#media-kit' : location.pathname); } catch(e){}
  renderTipos(); renderFiltros(); renderSecoes();
});
renderTipos(); renderFiltros(); renderSecoes();
</script>
</body>
</html>
