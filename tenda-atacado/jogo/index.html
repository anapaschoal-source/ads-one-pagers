*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B396E;--red:#EE2E24;--y:#FFC21A;--o:#FF9F00;--green:#18A558;--f:'Manrope',system-ui,sans-serif;--t:'Baloo','Manrope',system-ui,sans-serif;--poc-h:40px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--y);font-family:var(--f);color:var(--navy);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 14% 18%,rgba(255,255,255,.11) 0 6deg,rgba(255,255,255,0) 6deg 18deg),
  radial-gradient(55% 70% at 14% 18%,#FFE15A 0%,rgba(255,225,90,0) 70%),radial-gradient(80% 90% at 100% 100%,#FF9400 0%,rgba(255,148,0,0) 70%),linear-gradient(160deg,var(--y),#FFAE00)}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;display:grid;grid-template-columns:1fr 560px;align-items:center;padding:0 64px;gap:48px;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.copy{display:grid;gap:20px;align-content:center}
.brand{display:flex;align-items:center;gap:18px}
.brand .verao{height:92px;width:auto}
.brand .logo{height:74px;width:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
.badge{justify-self:start;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff;padding:8px 18px;border-radius:999px}
h1{font-family:var(--t);font-size:66px;line-height:1;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--red)}
p{font-size:24px;line-height:1.42;font-weight:700;color:#2b3f6b;max-width:30ch}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:12px;min-height:76px;padding:0 44px;border:0;border-radius:999px;font:800 26px var(--t);cursor:pointer;background:var(--red);color:#fff;box-shadow:0 12px 30px rgba(190,30,10,.35),inset 0 -5px 0 #b81d15}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 12px 30px rgba(27,57,110,.18),inset 0 -5px 0 #e3e3e3}
.btn:active{transform:translateY(3px)}
.foot{font-size:15px;color:#4a5b80;font-weight:700}
/* placar */
.hud{display:grid;gap:10px}
.hud .row{display:flex;align-items:baseline;gap:14px}
.hud .n{font-family:var(--t);font-size:64px;font-weight:800;line-height:1;color:var(--navy)}
.hud .n small{font-size:28px;color:#4a5b80}
.meter{height:22px;border-radius:99px;background:rgba(27,57,110,.16);overflow:hidden;width:440px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--red),#ff5a3c);border-radius:99px;transition:width .25s}
.clock{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:#4a5b80}
.bar{height:10px;border-radius:99px;background:rgba(27,57,110,.15);overflow:hidden;width:300px}
.bar i{display:block;height:100%;width:100%;background:var(--navy);border-radius:99px;transform-origin:left}
.msg{font-size:24px;font-weight:800;min-height:34px;color:var(--navy)}
/* gôndola */
.shelf{justify-self:center;width:560px;background:#fff;border-radius:32px;padding:22px 22px 14px;box-shadow:0 30px 60px rgba(150,70,0,.25);position:relative}
.shelf .top{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px;font:800 15px var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.shelf .top b{background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.slot{position:relative;height:150px;border-bottom:10px solid #D9DEEA;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.slot:nth-child(3n+1),.slot:nth-child(3n+2){border-right:2px dashed #EEF0F6}
.item{position:relative;border:0;background:none;cursor:pointer;width:140px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;animation:drop .28s cubic-bezier(.2,1.6,.4,1) both}
.item::after{content:"";position:absolute;inset:-12px}
.item svg{width:96px;height:96px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.tag{margin-top:4px;background:var(--y);color:var(--navy);font:800 15px var(--f);padding:3px 10px;border-radius:8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.item.fade{animation:fade .35s ease-in forwards}
@keyframes drop{from{transform:translateY(-36px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{to{opacity:0;transform:scale(.7)}}
.ok{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:var(--green);color:#fff;font:800 22px var(--f);padding:8px 14px;border-radius:12px;animation:up .55s ease-out forwards;white-space:nowrap}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}to{opacity:0;transform:translate(-50%,-40px)}}
.cart{display:flex;align-items:center;gap:10px;margin:12px 6px 0;font:800 16px var(--f);color:#4a5b80}
.cart svg{width:30px;height:30px}
/* cupom */
.card{justify-self:center;width:520px;background:#fff;color:var(--navy);border-radius:32px;padding:42px 46px;position:relative;box-shadow:0 30px 60px rgba(150,70,0,.3);animation:cpop .5s cubic-bezier(.2,1.6,.4,1) both;border-top:14px solid var(--red)}
@keyframes cpop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.card .k{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.card .v{font-family:var(--t);font-size:60px;font-weight:800;line-height:1;margin:12px 0 10px}
.card .d{font-size:19px;font-weight:700;color:#4a5b80;line-height:1.4}
.card .code{margin-top:26px;border-top:3px dashed #e3e7f0;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.card .code b{font-family:var(--t);font-size:40px;letter-spacing:.04em;background:var(--red);color:#fff;padding:8px 20px;border-radius:12px}
.card .code span{font-size:15px;font-weight:700;color:#4a5b80;max-width:16ch;line-height:1.35}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(860px) rotate(540deg);opacity:.2}}
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14)}
.poc-left{display:flex;align-items:center;gap:12px}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:700;color:#cbd5e1}
.poc-right{display:flex;align-items:center;gap:10px}
.poc-powered{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  <div id="app"></div>
  <div class="confetti" id="cf"></div>

function play(){stop();total=0;app.innerHTML='<section class="screen"><div class="copy">'+brand()+'<div class="hud"><div class="row"><div class="n" id="n">R$ 0<small> / R$ 399</small></div></div><div class="meter"><i id="m"></i></div><div class="clock">Tempo<div class="bar"><i id="t"></i></div></div></div><div class="msg" id="msg">Toque nas ofertas!</div><h1>Rápido, <em>antes que acabem!</em></h1></div>'+shelf()+'</section>';
 ativo=true;fim=performance.now()+TEMPO*1000;spawn();spawn();raf=requestAnimationFrame(tick)}
function tick(t){if(!ativo)return;var r=Math.max(0,(fim-t)/(TEMPO*1000));document.getElementById('t').style.transform='scaleX('+r+')';if(r<=0){acabou();return}raf=requestAnimationFrame(tick)}
function spawn(){if(!ativo)return;var livres=[].filter.call(document.querySelectorAll('.slot'),function(l){return !l.firstChild});
 if(livres.length){var l=livres[Math.floor(Math.random()*livres.length)],p=PROD[Math.floor(Math.random()*PROD.length)];l.innerHTML=item(p,true);var b=l.firstChild;
  var tm=setTimeout(function(){if(b.parentNode&&ativo){b.classList.add('fade');setTimeout(function(){if(b.parentNode)b.remove()},350)}},VIDA);
  b.addEventListener('pointerdown',function(e){e.preventDefault();if(!ativo||b.classList.contains('fade'))return;clearTimeout(tm);b.remove();total+=p[1];
   var ok=document.createElement('div');ok.className='ok';ok.textContent='+ '+brl(p[1]);l.appendChild(ok);setTimeout(function(){ok.remove()},550);
   document.getElementById('n').innerHTML=brl(total).replace(',00','')+'<small> / R$ 399</small>';document.getElementById('m').style.width=Math.min(100,total/META*100)+'%';
   document.getElementById('cartx').textContent=p[2]+' no carrinho!';document.getElementById('msg').textContent=total>=META*.75?'Quase lá!':'Boa compra!';
   if(total>=META){stop();confetti();setTimeout(cupom,900)}});
 }
 spawnT=setTimeout(spawn,Math.max(380,700-total*.6))}
function acabou(){stop();app.innerHTML='<section class="screen"><div class="copy">'+brand()+'<h1>Seu carrinho fechou em <em>'+brl(total)+'</em></h1><p>Mais uma rodada? Faltaram '+brl(Math.max(0,META-total))+' para o frete grátis.</p><button class="btn" id="re">Tentar de novo</button></div>'+shelf()+'</section>';
 document.getElementById('re').onclick=play}
function cupom(){app.innerHTML='<section class="screen"><div class="copy">'+brand()+'<h1>Carrinho <em>cheio!</em></h1><p>Carrinho de '+brl(total)+'. Verão com preço baixo de verdade: use o cupom na primeira compra no site do Tenda Atacado.</p><button class="btn alt" id="re">Jogar de novo</button></div><div class="card"><div class="k">Cupom Tenda Atacado</div><div class="v">Frete grátis</div><div class="d">Na 1ª compra a partir de R$ 399.</div><div class="code"><b>FRETEZERO</b><span>Use no carrinho do site</span></div></div></section>';
 document.getElementById('re').onclick=intro}
function confetti(){var cf=document.getElementById('cf'),c=['#1B396E','#EE2E24','#fff','#FFE15A'],h='';
 for(var i=0;i<70;i++)h+='<i style="left:'+(Math.random()*100)+'%;background:'+c[i%4]+';animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.8+Math.random()*1.2)+'s"></i>';
 cf.innerHTML=h;setTimeout(function(){cf.innerHTML=''},3400)}
intro();
</script>
<script defer src="/_vercel/insights/script.js"></script></body>
