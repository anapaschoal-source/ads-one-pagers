<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrega Relâmpago • Mercado Livre • Goomer Games</title>
<style>
/* Entrega Relâmpago para a Página Especial do tablet Goomer. Palco 1280x800 escalado. Touch first. */
@font-face{font-family:'Manrope';src:url('__FONT700__') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Manrope';src:url('__FONT800__') format('woff2');font-weight:800;font-display:block}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--y:#FFE600;--y2:#FFF27A;--navy:#2D3277;--blue:#3483FA;--green:#00A650;--ink:#1F1F2E;--f:'Manrope',system-ui,sans-serif;--poc-h:40px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--y);font-family:var(--f);color:var(--navy);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;
  background:radial-gradient(60% 80% at 80% 40%,#FFF59E 0%,rgba(255,245,158,0) 65%),var(--y)}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 64px;gap:40px;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.copy{display:grid;gap:22px;align-content:center}
.logo{height:84px;width:auto;max-width:360px;object-fit:contain;justify-self:start}
.badge{justify-self:start;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px}
h1{font-size:68px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--blue)}
p{font-size:24px;line-height:1.45;font-weight:700;color:#3d4270;max-width:30ch}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:12px;min-height:76px;padding:0 44px;border:0;border-radius:999px;font:800 24px var(--f);cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 12px 30px rgba(52,131,250,.35),inset 0 -5px 0 #1f66d1}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 12px 30px rgba(45,50,119,.18),inset 0 -5px 0 #e3e3e3}
.btn:active{transform:translateY(3px)}
.foot{font-size:15px;color:#5a5f8c;font-weight:700}
/* placar */
.hud{display:flex;gap:16px;align-items:center}
.hud .n{font-size:54px;font-weight:800;line-height:1;color:var(--navy)}
.hud .n small{font-size:26px;color:#6b70a0}
.bar{height:16px;border-radius:99px;background:rgba(45,50,119,.15);overflow:hidden;width:420px}
.bar i{display:block;height:100%;width:100%;background:var(--navy);border-radius:99px;transform-origin:left}
.msg{font-size:26px;font-weight:800;min-height:36px;color:var(--navy)}
/* cidade */
.city{justify-self:center;width:540px;height:540px;background:#fff;border-radius:36px;padding:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;box-shadow:0 30px 60px rgba(45,50,119,.18);position:relative}
.lot{position:relative;border-radius:22px;background:#F3F4FA;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.house{position:relative;width:78px;height:62px;background:var(--navy);border-radius:6px;margin-bottom:22px}
.house::before{content:"";position:absolute;left:-10px;right:-10px;top:-34px;height:36px;background:var(--blue);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house::after{content:"";position:absolute;left:30px;bottom:0;width:18px;height:28px;background:var(--y);border-radius:4px 4px 0 0}
.lot:nth-child(3n+2) .house{background:#4b52a8}.lot:nth-child(4n) .house::before{background:#5ea0ff}
.pkg{position:absolute;right:12px;bottom:12px;width:62px;height:54px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(90deg,transparent 42%,var(--y) 42% 58%,transparent 58%),#C8955A;box-shadow:inset 0 -6px 0 #a87a43,0 8px 16px rgba(0,0,0,.18);animation:drop .28s cubic-bezier(.2,1.6,.4,1) both}
.pkg::after{content:"";position:absolute;inset:-14px}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ok{position:absolute;right:16px;bottom:14px;width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;animation:pop .4s ease-out both}
.miss{position:absolute;right:20px;bottom:18px;font-size:16px;font-weight:800;color:#c0392b;animation:pop .4s ease-out both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.truck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:0}
/* cupom */
.card{justify-self:center;width:500px;background:#fff;color:var(--ink);border-radius:32px;padding:44px 48px;position:relative;box-shadow:0 30px 60px rgba(45,50,119,.25);animation:cpop .5s cubic-bezier(.2,1.6,.4,1) both;border-top:12px solid var(--blue)}
@keyframes cpop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.card .k{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.card .v{font-size:58px;font-weight:800;line-height:1.05;margin:12px 0 8px;letter-spacing:-.02em;color:var(--navy)}
.card .d{font-size:19px;font-weight:700;color:#5a5f8c;line-height:1.4}
.card .code{margin-top:28px;border-top:3px dashed #e3e5f2;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.card .code b{font-size:34px;letter-spacing:.08em;background:var(--y);padding:10px 18px;border-radius:14px;color:var(--navy)}
.card .code span{font-size:15px;font-weight:700;color:#5a5f8c;max-width:15ch;line-height:1.35}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(860px) rotate(540deg);opacity:.2}}
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14)}
.poc-left{display:flex;align-items:center;gap:12px}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:700;color:#cbd5e1}
.poc-right{display:flex;align-items:center;gap:10px}
.poc-powered{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="viewport" id="vp">
  <div id="app"></div>
  <div class="confetti" id="cf"></div>
  <footer class="poc-bar">
    <div class="poc-left"><span class="poc-badge">POC</span><span class="poc-text">Protótipo de demonstração — não é um produto oficial do Mercado Livre. Nada digitado é guardado.</span></div>
    <div class="poc-right"><span class="poc-powered">powered by</span>__GOOMER_SVG__</div>
  </footer>
</div>
<script>
var LOGO='__LOGO__';
var META=10, TEMPO=20, VIDA=1500;
var app=document.getElementById('app'),feitas=0,fim=0,raf=null,spawnT=null,ativo=false;
function fit(){var vp=document.getElementById('vp');var s=Math.min(innerWidth/1280,innerHeight/800);vp.style.transform='scale('+s+')';vp.style.left=Math.round((innerWidth-1280*s)/2)+'px';vp.style.top=Math.round((innerHeight-800*s)/2)+'px'}
addEventListener('resize',fit);fit();
var idle;function bump(){clearTimeout(idle);idle=setTimeout(intro,60000)}
['pointerdown','keydown'].forEach(function(e){addEventListener(e,bump)});
function lg(){return '<img class="logo" src="'+LOGO+'" alt="Mercado Livre">'}
function city(){var h='';for(var i=0;i<9;i++)h+='<div class="lot" data-i="'+i+'"><div class="house"></div></div>';return '<div class="city" id="city">'+h+'</div>'}
function stop(){ativo=false;cancelAnimationFrame(raf);clearTimeout(spawnT)}
function intro(){stop();app.innerHTML='<section class="screen"><div class="copy">'+lg()+'<span class="badge">Entrega Relâmpago</span><h1>Entregue <em>10 pacotes</em> em 20 segundos</h1><p>Toque nos pacotes antes que eles sumam. Bateu a meta, ganha cupom no Mercado Livre.</p><button class="btn" id="go">Bora entregar</button><span class="foot">Leva 20 segundos, enquanto o pedido não chega.</span></div>'+city()+'</section>';
 var lots=document.querySelectorAll('.lot');[1,5,6].forEach(function(i){var b=document.createElement('button');b.className='pkg';b.tabIndex=-1;b.setAttribute('aria-hidden','true');lots[i].appendChild(b)});
 document.getElementById('go').onclick=play;bump()}
function play(){stop();feitas=0;app.innerHTML='<section class="screen"><div class="copy">'+lg()+'<div class="hud"><div class="n" id="n">0<small>/'+META+'</small></div><div class="msg" id="msg">Toque nos pacotes!</div></div><div class="bar"><i id="t"></i></div><h1>Rápido, <em>antes que sumam!</em></h1></div>'+city()+'</section>';
 ativo=true;fim=performance.now()+TEMPO*1000;spawn();raf=requestAnimationFrame(tick)}
function tick(t){if(!ativo)return;var r=Math.max(0,(fim-t)/(TEMPO*1000));document.getElementById('t').style.transform='scaleX('+r+')';if(r<=0){acabou();return}raf=requestAnimationFrame(tick)}
function spawn(){if(!ativo)return;var livres=[].filter.call(document.querySelectorAll('.lot'),function(l){return !l.querySelector('.pkg,.ok,.miss')});
 if(livres.length){var l=livres[Math.floor(Math.random()*livres.length)],b=document.createElement('button');b.className='pkg';b.setAttribute('aria-label','Entregar pacote');
  var tm=setTimeout(function(){if(b.parentNode){b.remove();marca(l,'miss','Ops!')}},VIDA);
  b.addEventListener('pointerdown',function(e){e.preventDefault();if(!ativo)return;clearTimeout(tm);b.remove();feitas++;marca(l,'ok','✓');
   document.getElementById('n').innerHTML=feitas+'<small>/'+META+'</small>';document.getElementById('msg').textContent=feitas>=META-2?'Quase lá!':'Entregue!';
   if(feitas>=META){stop();confetti();setTimeout(cupom,900)}});
  l.appendChild(b)}
 spawnT=setTimeout(spawn,Math.max(420,780-feitas*30))}
function marca(l,c,t){var s=document.createElement('div');s.className=c;s.textContent=t;l.appendChild(s);setTimeout(function(){s.remove()},500)}
function acabou(){stop();app.innerHTML='<section class="screen"><div class="copy">'+lg()+'<span class="badge">Faltou pouco</span><h1>Você entregou <em>'+feitas+' de '+META+'</em></h1><p>Mais uma rodada? Os pacotes ficam 1,5 segundo na porta.</p><button class="btn" id="re">Tentar de novo</button></div>'+city()+'</section>';
 document.getElementById('re').onclick=play}
function cupom(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',c='MESA';for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];
 app.innerHTML='<section class="screen"><div class="copy">'+lg()+'<span class="badge">Meta batida!</span><h1>Entrega <em>nota 10!</em></h1><p>Seu cupom chegou. Use no app do Mercado Livre na sua próxima compra.</p><button class="btn alt" id="re">Jogar de novo</button></div><div class="card"><div class="k">Cupom Mercado Livre</div><div class="v">R$ 20 OFF</div><div class="d">Em compras a partir de R$ 99 no app.</div><div class="code"><b>'+c+'</b><span>Válido por 7 dias</span></div></div></section>';
 document.getElementById('re').onclick=intro}
function confetti(){var cf=document.getElementById('cf'),c=['#2D3277','#3483FA','#fff','#00A650'],h='';
 for(var i=0;i<70;i++)h+='<i style="left:'+(Math.random()*100)+'%;background:'+c[i%4]+';animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.8+Math.random()*1.2)+'s"></i>';
 cf.innerHTML=h;setTimeout(function(){cf.innerHTML=''},3400)}
intro();
</script>
</body>
</html>
