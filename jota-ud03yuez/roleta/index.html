*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--f:'Manrope',system-ui,sans-serif;--poc-h:40px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--fundo);font-family:var(--f);color:var(--tinta);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;
  background:radial-gradient(55% 75% at 88% 105%,color-mix(in srgb,var(--destaque) 55%,transparent) 0%,transparent 62%),radial-gradient(50% 60% at 10% 0%,var(--fundo-luz) 0%,transparent 60%),var(--fundo)}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 72px;gap:40px;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.copy{display:grid;gap:22px;align-content:center}
.logo{height:64px;width:auto;max-width:300px;object-fit:contain;object-position:left}
.badge{justify-self:start;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--tinta);color:var(--fundo);padding:8px 16px;border-radius:999px}
h1{font-size:64px;line-height:1.2;font-weight:800;letter-spacing:-.025em}
h1 em{font-style:normal;white-space:nowrap;background:var(--tinta);color:var(--fundo);padding:2px 12px 4px;border-radius:12px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p{font-size:24px;line-height:1.45;font-weight:700;color:var(--suave);max-width:26ch}
.btn{justify-self:start;display:inline-flex;align-items:center;gap:12px;min-height:76px;padding:0 44px;border:0;border-radius:999px;font:800 24px var(--f);cursor:pointer;background:var(--tinta);color:var(--fundo);box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 -5px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px)}
.btn[disabled]{opacity:.55}
.foot{font-size:15px;color:var(--suave);font-weight:700}
.wheelbox{position:relative;justify-self:center;width:520px;height:520px}
.wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 30px 60px rgba(0,0,0,.28),0 0 0 14px var(--tinta);transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.pin{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:56px solid var(--tinta);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;inset:50%;width:124px;height:124px;margin:-62px;border-radius:50%;background:var(--tinta);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);overflow:hidden}
.hub img{width:78px;height:auto;max-height:60px;object-fit:contain}
.hub.branco img{filter:brightness(0) invert(1)}
.cupom{justify-self:center;width:500px;background:#fff;color:#111;border-radius:32px;padding:40px 46px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.cupom::before,.cupom::after{content:"";position:absolute;top:60%;width:44px;height:44px;border-radius:50%;background:var(--fundo)}
.cupom::before{left:-22px}.cupom::after{right:-22px}
.cupom .k{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--destaque)}
.cupom .v{font-size:96px;font-weight:800;line-height:1;margin:10px 0 4px;letter-spacing:-.04em}
.cupom .v small{font-size:42px;letter-spacing:-.02em}
.cupom .d{font-size:21px;font-weight:700;color:#5b5b66}
.cupom .code{margin-top:30px;border-top:3px dashed #e3e3ea;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.cupom .code b{white-space:nowrap;font-size:20px;letter-spacing:.04em;background:var(--fundo);color:var(--tinta);padding:10px 16px;border-radius:14px}
.cupom .code span{font-size:15px;font-weight:700;color:#5b5b66;max-width:18ch;line-height:1.35}
.form{display:grid;gap:14px;max-width:500px}
.field{display:block;width:100%;height:76px;border:3px solid var(--tinta);border-radius:20px;padding:0 24px;font:700 26px var(--f);color:#111;background:#fff;outline:none}
.field:focus{box-shadow:0 0 0 6px rgba(0,0,0,.15)}
.field.err{border-color:#C62828;box-shadow:0 0 0 6px rgba(198,40,40,.15)}
.msg{min-height:20px;font-size:16px;font-weight:800;color:#B71C1C}
.ok{display:flex;gap:14px;align-items:flex-start;font-size:16px;font-weight:700;color:var(--suave);line-height:1.4;cursor:pointer}
.ok input{appearance:none;-webkit-appearance:none;flex:none;width:32px;height:32px;border:3px solid var(--tinta);border-radius:9px;background:#fff;display:grid;place-items:center;cursor:pointer;margin-top:-3px}
.ok input:checked{background:var(--tinta)}
.ok input:checked::after{content:"";width:12px;height:7px;border-left:4px solid var(--fundo);border-bottom:4px solid var(--fundo);transform:translateY(-2px) rotate(-45deg)}
.loja{justify-self:center;width:500px;background:var(--tinta);color:#fff;border-radius:32px;padding:44px 46px;display:grid;gap:22px;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.loja .tag{justify-self:start;background:var(--fundo);color:var(--tinta);font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.loja h2{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.loja h2 span{color:var(--fundo)}
.loja ol{list-style:none;display:grid;gap:14px;counter-reset:s}
.loja li{counter-increment:s;display:flex;gap:14px;align-items:center;font-size:20px;font-weight:700;color:rgba(255,255,255,.88)}
.loja li::before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;background:var(--fundo);color:var(--tinta);display:grid;place-items:center;font-weight:800;font-size:18px}
.loja .qr{justify-self:start;background:#fff;padding:12px;border-radius:16px;width:170px}
.loja .qr img{display:block;width:100%}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(860px) rotate(540deg);opacity:.2}}
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14)}
.poc-left{display:flex;align-items:center;gap:12px}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:700;color:#cbd5e1}
.poc-right{display:flex;align-items:center;gap:10px}
.poc-powered{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="viewport" id="vp">
  <div id="app"></div>
  <div class="confetti" id="cf"></div>

(function(){
var C=CFG.cores, r=document.documentElement.style;
r.setProperty('--fundo',C.fundo);r.setProperty('--fundo-luz',C.fundo_luz||C.fundo);r.setProperty('--tinta',C.tinta);
r.setProperty('--destaque',C.destaque);r.setProperty('--suave',C.suave||C.tinta);
document.title=(CFG.titulo_aba||('Roleta '+CFG.marca))+' • Goomer Games';
document.getElementById('poc').textContent=CFG.poc||('Protótipo de demonstração, não é um produto oficial da '+CFG.marca+'.');
})();
var P=CFG.fatias, app=document.getElementById('app'), rot=0;
function esc(t){return String(t).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function fit(){var vp=document.getElementById('vp');var s=Math.min(innerWidth/1280,innerHeight/800);vp.style.transform='scale('+s+')';vp.style.left=Math.round((innerWidth-1280*s)/2)+'px';vp.style.top=Math.round((innerHeight-800*s)/2)+'px'}
addEventListener('resize',fit);fit();
function wheel(){var n=P.length,a=360/n,s='<svg class="wheel" id="wh" viewBox="-100 -100 200 200" style="transform:rotate('+rot+'deg)">';
 for(var i=0;i<n;i++){var a0=(i*a-90-a/2)*Math.PI/180,a1=((i+1)*a-90-a/2)*Math.PI/180,p=P[i];
  s+='<path d="M0 0L'+(100*Math.cos(a0)).toFixed(2)+' '+(100*Math.sin(a0)).toFixed(2)+'A100 100 0 0 1 '+(100*Math.cos(a1)).toFixed(2)+' '+(100*Math.sin(a1)).toFixed(2)+'Z" fill="'+p.cor+'"/>';
  var fs=p.emoji?24:(p.texto.length>9?10:12);
  s+='<text transform="rotate('+(i*a)+') translate(0 -'+(p.emoji?66:64)+')" text-anchor="middle" dominant-baseline="middle" font-family="Manrope" font-weight="800" font-size="'+fs+'" fill="'+(p.cor_texto||'#111')+'">'+esc(p.texto)+'</text>'}
 return s+'</svg>'}
function head(badge){return '<img class="logo" src="'+CFG.logo+'" alt="'+esc(CFG.marca)+'"><span class="badge">'+esc(badge)+'</span>'}
function intro(){var I=CFG.intro;
 app.innerHTML='<section class="screen"><div class="copy">'+head(I.selo)+'<h1>'+I.titulo+'</h1><p>'+I.texto+'</p><button class="btn" id="go">'+esc(I.botao)+'</button><span class="foot">'+I.rodape+'</span></div>'+
 '<div class="wheelbox"><div class="pin"></div>'+wheel()+'<div class="hub'+(CFG.logo_branco_no_hub===false?'':' branco')+'"><img src="'+CFG.logo+'" alt=""></div></div></section>';
 document.getElementById('go').onclick=spin}
function spin(){var b=document.getElementById('go');b.disabled=true;b.textContent='Girando...';
 var wins=[];P.forEach(function(p,i){if(p.premio!==false&&!p.emoji)wins.push(i)});if(!wins.length)wins=[0];
 var i=wins[Math.floor(Math.random()*wins.length)],a=360/P.length;rot+=360*6+(360-i*a)-(rot%360);
 document.getElementById('wh').style.transform='rotate('+rot+'deg)';setTimeout(function(){prize(P[i])},4400)}
function cupom(p){var Z=Object.assign({},CFG.premio,p.premio||{}),code=Z.codigo===true?(Z.prefixo_codigo||'GOOMER')+(1000+Math.floor(Math.random()*9000)):Z.codigo;
 return '<div class="cupom"><div class="k">'+esc(Z.rotulo)+'</div><div class="v">'+(Z.valor_prefixo?'<small>'+esc(Z.valor_prefixo)+'</small> ':'')+esc(Z.valor)+'</div><div class="d">'+Z.descricao+'</div>'+
 '<div class="code"><b>'+esc(code||Z.entrega||'Enviado por e-mail')+'</b><span>'+esc(Z.validade||'')+'</span></div></div>'}
var ganho;
function prize(p){ganho=p;var G=CFG.ganhou,K=CFG.captura;
 var form=K&&K.ativa!==false?'<div class="form"><input class="field" id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="'+esc(K.placeholder||'seu@email.com')+'" aria-label="Seu e-mail">'+
  '<label class="ok"><input type="checkbox" id="ck"><span>'+K.aceite+'</span></label><div class="msg" id="msg" role="alert"></div><button class="btn" id="rs">'+esc(K.botao||'Resgatar cupom')+'</button></div>'
  :'<button class="btn" id="rs">'+esc(G.botao||'Continuar')+'</button>';
 app.innerHTML='<section class="screen"><div class="copy">'+head(G.selo)+'<h1>'+G.titulo+'</h1><p>'+(K&&K.ativa!==false?K.texto:G.texto)+'</p>'+form+'</div>'+cupom(p)+'</section>';
 confetti();document.getElementById('rs').onclick=(K&&K.ativa!==false)?redeem:function(){done('')}}
function redeem(){var em=document.getElementById('em'),ck=document.getElementById('ck'),m=document.getElementById('msg'),v=em.value.trim();
 em.classList.remove('err');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){em.classList.add('err');m.textContent='Confira o e-mail digitado.';em.focus();return}
 if(!ck.checked){m.textContent='Marque a caixa para receber o cupom.';return}
 em.blur();done(v)}
function done(email){var F=CFG.final;
 var txt=F.texto.replace('{email}','<b style="color:var(--tinta)">'+esc(email)+'</b>');
 app.innerHTML='<section class="screen"><div class="copy">'+head(F.selo)+'<h1>'+F.titulo+'</h1><p>'+txt+'</p><button class="btn" id="re">'+esc(F.botao||'Voltar ao início')+'</button></div>'+
 '<div class="loja"><span class="tag">'+esc(F.tag)+'</span><h2>'+F.cartao_titulo+'</h2>'+(F.qr?'<div class="qr"><img src="'+F.qr+'" alt="QR code"></div>':'')+
 (F.passos&&F.passos.length?'<ol>'+F.passos.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol>':'')+'</div></section>';
 document.getElementById('re').onclick=intro;confetti()}
function confetti(){var cf=document.getElementById('cf'),c=CFG.confete||[CFG.cores.tinta,CFG.cores.destaque,'#FFFFFF',CFG.cores.fundo_luz||CFG.cores.fundo],h='';
 for(var i=0;i<70;i++)h+='<i style="left:'+(Math.random()*100)+'%;background:'+c[i%c.length]+';animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.8+Math.random()*1.2)+'s"></i>';
 cf.innerHTML=h;setTimeout(function(){cf.innerHTML=''},3400)}
// volta ao início após 60s sem toque (tablet na mesa)
var idle;function bump(){clearTimeout(idle);idle=setTimeout(intro,60000)}
['pointerdown','keydown'].forEach(function(ev){addEventListener(ev,bump)});bump();
intro();
