*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#FA2F93;--pink-dark:#C7146F;--pink-soft:#FFF5FA;--ink:#09090B;--ink-2:#17171C;--ink-3:#26262E;
  --muted:#A1A1AA;--line:rgba(255,255,255,.12);--good:#22C55E;
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --poc-h:40px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:var(--f);color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
.viewport{position:absolute;width:1280px;height:800px;transform-origin:top left;overflow:hidden;
  background:radial-gradient(70% 90% at 88% 0%,rgba(250,47,147,.42) 0%,rgba(250,47,147,0) 60%),var(--ink)}
.screen{position:absolute;inset:0 0 var(--poc-h) 0;animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{display:block;height:30px;width:auto}
.logo.white{filter:brightness(0) invert(1)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:72px;padding:0 40px;border:0;border-radius:999px;
  font:700 22px var(--f);cursor:pointer;transition:transform .1s ease}
.btn:active{transform:translateY(3px)}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 10px 30px rgba(250,47,147,.38),inset 0 -4px 0 var(--pink-dark)}
.btn-ghost{background:transparent;color:#E4E4E7;border:2px solid var(--line)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------------- intro ---------------- */
.intro{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;padding:0 72px;gap:40px}
.intro .copy{display:grid;gap:26px}
.badge{justify-self:start;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);
  border:2px solid rgba(250,47,147,.5);padding:8px 16px;border-radius:999px}
.intro h1{font-size:76px;line-height:1.02;font-weight:700;letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--pink)}
.intro p{font-size:24px;line-height:1.45;color:#D4D4D8;font-weight:500;max-width:30ch}
.intro .ctas{display:flex;gap:16px;align-items:center;margin-top:6px}
.intro .foot{font-size:15px;color:var(--muted);font-weight:500}
.tower{justify-self:center;position:relative;width:330px;height:560px}
.tower .b1{position:absolute;right:0;bottom:0;width:250px;height:520px;background:var(--ink-2);border-radius:28px;padding:26px 22px 90px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.tower .b1 i{border-radius:9px;background:var(--ink-3)}
.tower .b1 i.on{background:var(--pink)}
.tower .b1 i.soft{background:#FFC2E0}
.tower .b1 .door{position:absolute;left:50%;bottom:0;width:66px;height:78px;transform:translateX(-50%);background:var(--pink);border-radius:12px 12px 0 0}
.tower .b2{position:absolute;left:0;bottom:0;width:92px;height:330px;background:#131317;border-radius:20px;padding:20px 16px;display:grid;gap:14px;grid-auto-rows:1fr}
.tower .b2 i{border-radius:7px;background:var(--ink-3)}
.tower .b2 i.on{background:#7A1D4D}
.tower .b1 i.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{background:var(--ink-3)}50%{background:var(--pink)}}

/* ---------------- jogo ---------------- */
.play{display:grid;grid-template-columns:300px 1fr;gap:40px;padding:40px 56px 28px}
.side{display:flex;flex-direction:column;gap:22px}
.side h2{font-size:34px;line-height:1.1;font-weight:700}
.side h2 em{font-style:normal;color:var(--pink)}
.side .hint{font-size:18px;line-height:1.45;color:#D4D4D8;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.stat{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found span{font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--ink-2);color:#71717A;border:1px solid var(--line)}
.found span.ok{background:rgba(250,47,147,.16);color:#FF8CC4;border-color:rgba(250,47,147,.45)}
.side .logo{align-self:flex-start}
.side .quit{margin-top:auto;align-self:flex-start;min-height:60px;font-size:17px;padding:0 26px}
.board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:24px;align-self:center;height:560px}
.card{font-family:var(--f);color:var(--ink);position:relative;border:0;background:transparent;perspective:1000px;cursor:pointer;border-radius:22px}
.card:focus-visible{outline:3px solid #fff;outline-offset:4px}
.card .in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.back{background:linear-gradient(150deg,#FF4FA6 0%,var(--pink) 45%,var(--pink-dark) 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.35)}
.back::before{content:"";position:absolute;inset:14px;border:2px dashed rgba(255,255,255,.35);border-radius:14px}
.back img{height:24px;width:auto;filter:brightness(0) invert(1);opacity:.95}
.front{transform:rotateY(180deg);background:#fff;color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.front svg{width:88px;height:88px;stroke:var(--pink);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.front b{font-size:24px;font-weight:700}
.card.done .front{background:var(--pink-soft);box-shadow:0 0 0 3px var(--pink),0 10px 24px rgba(0,0,0,.35)}
.card.done .front::after{content:"Incluso";position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--pink);color:#fff;padding:4px 9px;border-radius:999px}
.card.miss .in{animation:shake .4s ease}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.toast{position:absolute;left:50%;bottom:62px;transform:translate(-50%,20px);opacity:0;background:#fff;color:var(--ink);font-weight:700;font-size:20px;
  padding:12px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .25s,transform .25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{font-style:normal;color:var(--pink)}

/* ---------------- fim ---------------- */
.win{display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:56px;padding:0 72px}
.win .copy{display:grid;gap:22px}
.win h1{font-size:66px;line-height:1.04;font-weight:700;letter-spacing:-.02em}
.win h1 em{font-style:normal;color:var(--pink)}
.win p{font-size:22px;line-height:1.45;color:#D4D4D8;font-weight:500}
.win ul{list-style:none;display:grid;gap:12px}
.win li{display:flex;gap:14px;align-items:center;font-size:21px;font-weight:500}
.win li i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.win li i svg{width:16px;height:16px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.score{font-size:17px;color:var(--muted);font-weight:500}
.ticket{background:#fff;color:var(--ink);border-radius:28px;padding:34px 36px;display:grid;gap:16px;position:relative;box-shadow:0 30px 70px rgba(250,47,147,.25)}
.ticket::before,.ticket::after{content:"";position:absolute;top:58%;width:36px;height:36px;border-radius:50%;background:var(--ink)}
.ticket::before{left:-18px}.ticket::after{right:-18px}
.ticket .k{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.ticket .t{font-size:48px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.ticket .s{font-size:19px;color:#52525B;font-weight:500}
.ticket .code{margin-top:10px;border-top:2px dashed #E4E4E7;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.ticket .code span{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#71717A}
.ticket .code b{font-size:30px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ticket .fine{font-size:13px;color:#71717A;line-height:1.4}
.win .ctas{display:flex;gap:14px;margin-top:6px}
.win .ctas .btn{padding:0 30px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(860px) rotate(540deg)}}

/* ---------------- faixa Goomer ---------------- */
.poc-bar{position:absolute;z-index:60;left:0;right:0;bottom:0;height:var(--poc-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:#15161d;border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -6px 18px rgba(0,0,0,.45);pointer-events:none}
.poc-left{display:flex;align-items:center;gap:12px;min-width:0}
.poc-badge{background:#2b00ff;color:#fff;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.poc-text{font-size:12px;font-weight:500;color:#cbd5e1;white-space:nowrap}
.poc-right{display:flex;align-items:center;gap:10px}
.poc-powered{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
.goomer-logo{display:block;width:88px;height:auto;color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  var chips=PAIRS.map(function(p){return '<span data-c="'+p.id+'">'+p.n+'</span>'}).join('');
  app.innerHTML='<section class="screen play"><aside class="side"><img class="logo" src="'+LOGO+'" alt="Housi">'+
    '<h2>Ache os pares do que <em>já vem incluso</em>.</h2><p class="hint">Toque em duas cartas. Se forem iguais, elas ficam abertas.</p>'+
    '<div class="stats"><div class="stat"><b id="pairs">0/4</b><span>Pares</span></div><div class="stat"><b id="time">0:00</b><span>Tempo</span></div></div>'+
    '<div class="found" id="found">'+chips+'</div>'+
    '<button class="btn btn-ghost quit" id="quit" type="button">Sair do jogo</button></aside><div class="board" id="board">'+cards+'</div></section>';
  document.getElementById('quit').onclick=function(){clearInterval(st.timer);intro()};
  st.timer=setInterval(function(){var s=Math.floor((Date.now()-st.t0)/1000);document.getElementById('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250);
  [].forEach.call(document.querySelectorAll('.card'),function(el){el.onclick=function(){flip(el)}});
}
function flip(el){
  if(st.lock||el.classList.contains('up')||el.classList.contains('done'))return;
  el.classList.add('up');st.open.push(el);
  if(st.open.length<2)return;
  st.moves++;st.lock=true;
  var a=st.open[0],b=st.open[1];
  if(a.dataset.id===b.dataset.id){
    setTimeout(function(){a.classList.add('done');b.classList.add('done');a.classList.remove('up');b.classList.remove('up');
      st.done++;document.getElementById('pairs').textContent=st.done+'/4';
      document.querySelector('[data-c="'+a.dataset.id+'"]').classList.add('ok');
      var p=PAIRS.filter(function(x){return x.id===a.dataset.id})[0];
      toast(p.n+' <i>incluso!</i>');
      st.open=[];st.lock=false;
      if(st.done===PAIRS.length){clearInterval(st.timer);setTimeout(win,900)}
    },420);
  }else{
    setTimeout(function(){a.classList.add('miss');b.classList.add('miss')},450);
    setTimeout(function(){a.classList.remove('up','miss');b.classList.remove('up','miss');st.open=[];st.lock=false},1050);
  }
}
function win(){
  var s=Math.floor((Date.now()-st.t0)/1000);
  var items=['Internet, luz, água e IPTU inclusos','Apê mobiliado, pronto para morar','Sem fiador e sem burocracia'];
  app.innerHTML='<section class="screen win"><div class="copy"><img class="logo" src="'+LOGO+'" alt="Housi">'+
    '<h1>Apê completo. <em>Tudo incluso.</em></h1>'+
    '<ul>'+items.map(function(t){return '<li><i>'+CHECK+'</i>'+t+'</li>'}).join('')+'</ul>'+
    '<span class="score">Você achou os 4 pares em '+st.moves+' jogadas e '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'.</span>'+
    '<div class="ctas"><button class="btn btn-primary" id="again" type="button">Jogar de novo</button><button class="btn btn-ghost" id="menu" type="button">Voltar ao cardápio</button></div></div>'+
    '<div class="ticket"><span class="k">Seu benefício</span><span class="t">10% OFF na primeira reserva</span>'+
    '<span class="s">Use no app Housi ou em housi.com</span>'+
    '<div class="code"><span>Código</span><b>GOOMER10</b></div>'+
    '<span class="fine">Benefício ilustrativo, criado para demonstração. Protótipo — não é uma oferta oficial da Housi.</span></div></section>';
  document.getElementById('again').onclick=play;
  document.getElementById('menu').onclick=intro;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    var c=document.createElement('div');c.className='confetti';var cols=['#FA2F93','#FFC2E0','#ffffff','#FF7AB8'];
    for(var i=0;i<60;i++){var p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%4];
      p.style.animationDuration=(2.2+Math.random()*1.8)+'s';p.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(p)}
    document.querySelector('.win').appendChild(c);setTimeout(function(){c.remove()},5000);
  }
}
intro();
})();
</script>
</body>
</html>
